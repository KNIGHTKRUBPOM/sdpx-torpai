openapi: 3.1.0
info:
  title: PairEval API
  version: 2.0.0-m4-local
  description: PairEval local M4 contract for evaluation, scoring governance, notifications and CSV/XLSX export.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{host}
    description: Deployment-specific PairEval API host
    variables:
      host:
        default: api.paireval.invalid
        description: Replace with the approved staging or production host.
security:
  - bearerAuth: []
  - demoUser: []
tags:
  - name: Classrooms
    description: Classroom creation, membership and atomic roster operations.
  - name: Assignments
    description: Assignment lifecycle, feasibility and pair generation.
  - name: Evaluations
    description: Privacy-scoped pairwise drafts, submissions and scores.
  - name: Governance
    description: Finalization, overrides, exclusions, appeals and audit.
  - name: Privacy
    description: Privacy notice, acknowledgement and data-subject export.
  - name: Notifications
    description: User notification inbox and maintenance jobs.
paths:
  /health:
    get:
      security: []
      operationId: health
      summary: Verify API and database connectivity
      responses:
        '200': { description: API and database are healthy }
  /api/demo/users:
    get:
      security: []
      operationId: listDemoUsers
      summary: List selectable users when demo authentication is enabled
      responses:
        '200': { description: Demo users }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/me:
    get:
      operationId: getCurrentUser
      summary: Return the caller, memberships and privacy acknowledgement state
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/classrooms:
    get:
      tags: [Classrooms]
      operationId: listClassrooms
      summary: List classrooms visible to the caller
      responses:
        '200': { description: Visible classrooms }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Classrooms]
      operationId: createClassroom
      summary: Create a classroom
      x-user-story: US-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomCreate'
      responses:
        '201':
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/classrooms/{classroomId}/roster:import:
    parameters:
      - $ref: '#/components/parameters/ClassroomId'
    post:
      tags: [Classrooms]
      operationId: importRoster
      summary: Atomically import a classroom roster
      x-user-story: US-02
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Entire roster imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/classrooms/{classroomId}/assignments:
    parameters:
      - $ref: '#/components/parameters/ClassroomId'
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Create a draft assignment and criteria
      x-user-story: US-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Draft assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/assignments:
    get:
      tags: [Assignments]
      operationId: listAssignments
      summary: List assignments visible to the caller
      responses:
        '200': { description: Visible assignments }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/assignments/{assignmentId}/feasibility:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      operationId: getPairingFeasibility
      summary: Preview feasible coverage and evaluator workload
      x-user-story: US-04
      responses:
        '200':
          description: Feasibility result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feasibility'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/assignments/{assignmentId}:publish:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Assignments]
      operationId: publishAssignment
      summary: Validate and publish an assignment, persisting generated pairs
      x-user-story: US-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seed]
              properties:
                seed:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Assignment published and pairs created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/assignments/{assignmentId}/my-evaluations:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - name: side
        in: query
        required: false
        schema:
          type: string
          enum: [GROUP, INDIVIDUAL]
          default: GROUP
    get:
      tags: [Evaluations]
      operationId: getMyEvaluations
      summary: Get authorized evaluator pair assignments and current drafts
      x-user-story: US-06
      responses:
        '200':
          description: Evaluation workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/{pairAssignmentId}:
    parameters:
      - name: pairAssignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Evaluations]
      operationId: saveComparisonDraft
      summary: Idempotently save the evaluator's current draft
      x-user-story: US-06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonSave'
      responses:
        '200':
          description: Current comparison draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/assignments/{assignmentId}/submissions:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
    post:
      tags: [Evaluations]
      operationId: submitEvaluation
      summary: Submit the latest drafts for one evaluation side
      x-user-story: US-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side:
                  type: string
                  enum: [GROUP, INDIVIDUAL]
      responses:
        '201':
          description: Submission revision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/assignments/{assignmentId}/my-score:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Evaluations]
      operationId: getMyInterimScore
      summary: Return only the caller's privacy-safe interim score
      x-user-story: US-08
      responses:
        '200':
          description: Interim score or insufficient-data state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assignments/{assignmentId}/reports/group:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Evaluations]
      operationId: getGroupReport
      summary: Aggregate group criterion scores and flags
      responses:
        '200': { description: Group report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/assignments/{assignmentId}/reports/individual:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Evaluations]
      operationId: getIndividualReport
      summary: Aggregate individual scores and participation
      responses:
        '200': { description: Individual report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/assignments/{assignmentId}/reports/coverage:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Evaluations]
      operationId: getCoverageReport
      summary: Return assigned and submitted coverage for every pair
      responses:
        '200': { description: Pair coverage report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/assignments/{assignmentId}/reports/quality:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Evaluations]
      operationId: getQualityReport
      summary: Return current quality signals and recommended actions
      responses:
        '200': { description: Quality report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/assignments/{assignmentId}/exports:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Evaluations]
      operationId: exportReport
      summary: Export CSV or a four-sheet XLSX report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, report]
              properties:
                format: { type: string, enum: [CSV, XLSX] }
                report: { type: string, enum: [GROUP, INDIVIDUAL, COVERAGE, RAW] }
                includeIdentities: { type: boolean, default: false }
                identityConfirmation: { type: [string, 'null'], const: EXPORT_IDENTITIES }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/assignments/{assignmentId}:finalize:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Governance]
      operationId: finalizeAssignment
      summary: Create an immutable final score snapshot after the deadlines
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Assignment finalized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/assignments/{assignmentId}:reopen:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Governance]
      operationId: reopenAssignment
      summary: Reopen a finalized assignment with a reason
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '200': { description: Assignment reopened }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/assignments/{assignmentId}/overrides:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Governance]
      operationId: createScoreOverride
      summary: Override a group or individual component with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, itemId, overrideValue, reason]
              properties:
                side: { type: string, enum: [GROUP, INDIVIDUAL] }
                itemId: { type: string }
                overrideValue: { type: number, minimum: 0 }
                reason: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        '201': { description: Override recorded and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/comparisons/{pairAssignmentId}:exclude:
    parameters:
      - name: pairAssignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Governance]
      operationId: excludeComparison
      summary: Exclude a submitted comparison with a reason
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '201': { description: Comparison excluded and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/appeals:
    post:
      tags: [Governance]
      operationId: createAppeal
      summary: Create a student appeal during the seven-day final-score window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId, message]
              properties:
                assignmentId: { type: string, format: uuid }
                message: { type: string, minLength: 10, maxLength: 4000 }
      responses:
        '201': { description: Appeal created }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/assignments/{assignmentId}/appeals:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Governance]
      operationId: listAppeals
      summary: List appeals for an assignment
      responses:
        '200': { description: Appeals }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/appeals/{appealId}:resolve:
    parameters:
      - name: appealId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Governance]
      operationId: resolveAppeal
      summary: Resolve or reject an appeal with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: { type: string, enum: [RESOLVED, REJECTED] }
                resolution: { type: string, minLength: 5, maxLength: 4000 }
      responses:
        '200': { description: Appeal resolved }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/assignments/{assignmentId}/audit:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Governance]
      operationId: listAuditEvents
      summary: List assignment audit events with role-aware actor identity
      responses:
        '200': { description: Append-only audit events }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/privacy/notice:
    get:
      tags: [Privacy]
      security: []
      operationId: getPrivacyNotice
      summary: Return the current privacy notice and retention periods
      responses:
        '200': { description: Privacy notice }
  /api/privacy/acknowledgements:
    post:
      tags: [Privacy]
      operationId: acknowledgePrivacyNotice
      summary: Record the caller's privacy acknowledgement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                noticeVersion: { type: string, const: v1.0, default: v1.0 }
      responses:
        '201': { description: Acknowledgement recorded }
  /api/me/data-export:
    get:
      tags: [Privacy]
      operationId: exportMyData
      summary: Return the caller's data-subject export
      responses:
        '200': { description: Personal data export }
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the caller's latest notifications
      responses:
        '200': { description: Notification inbox }
  /api/notifications/{notificationId}:read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one owned notification read or unread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean, default: true }
      responses:
        '200': { description: Notification state updated }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/run:
    post:
      tags: [Notifications]
      operationId: runOwnerMaintenance
      summary: Run reminder, auto-finalize and retention jobs for owned classrooms
      responses:
        '200': { description: Maintenance summary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/instructor/classrooms/{classroomId}/summary:
    parameters:
      - $ref: '#/components/parameters/ClassroomId'
    get:
      tags: [Classrooms]
      operationId: getInstructorClassroomSummary
      summary: Return classroom counts and assignment progress for instructors
      responses:
        '200': { description: Instructor classroom summary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC
    demoUser:
      type: apiKey
      in: header
      name: X-User-Id
      description: Local/demo mode only; production requires the OIDC adapter.
  parameters:
    ClassroomId:
      name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    ReasonRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 5, maxLength: 2000 }
  responses:
    BadRequest:
      description: Malformed request or file
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource was not found in the caller's classroom scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource state or deadline conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ClassroomCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 120
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        timezone:
          type: string
          default: Asia/Bangkok
          examples: [Asia/Bangkok]
    Classroom:
      allOf:
        - $ref: '#/components/schemas/ClassroomCreate'
        - type: object
          required: [id, slug]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
    RosterImportResult:
      type: object
      required: [imported, groups]
      properties:
        imported:
          type: integer
          minimum: 0
        groups:
          type: integer
          minimum: 0
    CriterionInput:
      type: object
      additionalProperties: false
      required: [side, name, weightPct]
      properties:
        side:
          type: string
          enum: [GROUP, INDIVIDUAL]
        name:
          type: string
          minLength: 1
        weightPct:
          type: number
          minimum: 0
          maximum: 100
    AssignmentCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - deadline
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 180
        description:
          type: string
          maxLength: 4000
        groupMaxScore:
          type: number
          minimum: 0
          default: 15
        individualMaxScore:
          type: number
          minimum: 0
          default: 0
        deadline:
          type: string
          format: date-time
        individualDeadline:
          type: [string, 'null']
          format: date-time
        targetCoverage:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        maxWorkload:
          type: integer
          minimum: 1
          maximum: 30
          default: 8
        minComparisons:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        scoreFloor:
          type: number
          minimum: 0
          maximum: 1
          default: 0.60
        scoreCeiling:
          type: number
          minimum: 0
          maximum: 1
          default: 1.00
        completionThreshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 0.90
        instructorWeight:
          type: number
          minimum: 0
          default: 1.00
        seed:
          type: integer
          format: int64
          default: 20260819
        criteria:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CriterionInput'
    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentCreate'
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, PUBLISHED, OPEN, CLOSED, FINALIZED]
    Feasibility:
      type: object
      required: [targetCoverage, actualCoverage, workload, pairCount, totalComparisons, reduced, explanation]
      properties:
        targetCoverage:
          type: integer
        actualCoverage:
          type: integer
        workload:
          type: integer
        pairCount:
          type: integer
        totalComparisons:
          type: integer
        reduced:
          type: boolean
        explanation:
          type: string
    PublishResult:
      type: object
      required: [assignmentId, status, pairAssignments, feasibility]
      properties:
        assignmentId:
          type: string
          format: uuid
        status:
          type: string
          const: PUBLISHED
        pairAssignments:
          type: integer
          minimum: 1
        feasibility:
          $ref: '#/components/schemas/Feasibility'
    EvaluationPair:
      type: object
      required: [id, criterion, leftItem, rightItem, artifactUrls, status]
      properties:
        id:
          type: string
          format: uuid
        criterion:
          type: string
        leftItem:
          type: string
        rightItem:
          type: string
        artifactUrls:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: uri
        choice:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [UNANSWERED, DRAFT, SUBMITTED]
    ComparisonSave:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          type: integer
          minimum: 1
          maximum: 6
        timeOnTaskMs:
          type: integer
          minimum: 0
    Comparison:
      type: object
      required: [pairAssignmentId, choice, status, savedAt]
      properties:
        pairAssignmentId:
          type: string
          format: uuid
        choice:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [DRAFT, SUBMITTED]
        savedAt:
          type: string
          format: date-time
    SubmissionResult:
      type: object
      required: [assignmentId, side, revision, submittedCount, unansweredCount, submittedAt]
      properties:
        assignmentId:
          type: string
          format: uuid
        side:
          type: string
          enum: [GROUP, INDIVIDUAL]
        revision:
          type: integer
          minimum: 1
        submittedCount:
          type: integer
        unansweredCount:
          type: integer
        submittedAt:
          type: string
          format: date-time
    MyScore:
      type: object
      required: [state, label, participationRatio, participationMultiplier, flags]
      properties:
        state:
          type: string
          enum: [INSUFFICIENT_DATA, INTERIM, FINAL]
        label:
          type: string
        groupComponent:
          type: [number, 'null']
        individualComponent:
          type: [number, 'null']
        participationRatio:
          type: number
          minimum: 0
          maximum: 1
        participationMultiplier:
          type: number
          minimum: 0
          maximum: 1
        total:
          type: [number, 'null']
        flags:
          type: array
          items:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field, requestId]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            field:
              type: [string, 'null']
            requestId:
              type: string
