name: PairEval CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend -q --cov=backend/src --cov-fail-under=85 --cov-report=term-missing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
        working-directory: backend
      - name: Wait for API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend

  docker-and-load:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: docker compose ps
      - run: docker run --rm --network host -v "$PWD:/work" -e API_BASE_URL=http://127.0.0.1:8000 -e PERF_MAX_DURATION=2m grafana/k6:latest run /work/performance/paireval.js
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
